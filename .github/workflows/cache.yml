name: "Build and Cache Systems"

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
          - name: darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cloudtide
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"

      - name: Fast Build and Cache Systems via nix-fast-build
        run: |
          cat << EOF > /tmp/ci.nix
          let
            flake = builtins.getFlake "$PWD";
            system = builtins.currentSystem;
            lib = flake.inputs.nixpkgs.lib;
            isDarwin = lib.hasSuffix "-darwin" system;
          in
          if isDarwin then
            (lib.concatMapAttrs (name: cfg:
              lib.optionalAttrs (cfg.pkgs.stdenv.hostPlatform.system == system) {
                "darwin-\${name}" = cfg.system;
              }
            ) (flake.darwinConfigurations or { }))
            // (lib.concatMapAttrs (name: cfg:
              lib.optionalAttrs (cfg.pkgs.stdenv.hostPlatform.system == system) {
                "home-\${name}" = cfg.activationPackage;
              }
            ) (flake.homeConfigurations or { }))
          else
            (lib.concatMapAttrs (name: cfg:
              lib.optionalAttrs (cfg.pkgs.stdenv.hostPlatform.system == system) {
                "nixos-\${name}" = cfg.config.system.build.toplevel;
              }
            ) (flake.nixosConfigurations or { }))
            // (lib.concatMapAttrs (name: cfg:
              lib.optionalAttrs (cfg.pkgs.stdenv.hostPlatform.system == system) {
                "home-\${name}" = cfg.activationPackage;
              }
            ) (flake.homeConfigurations or { }))
          EOF

          nix run nixpkgs#nix-fast-build -- \
            --file /tmp/ci.nix \
            --skip-cached \
            --cachix-cache cloudtide \
            --push-build-closure \
            --no-nom
